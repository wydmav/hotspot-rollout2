<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 130" width="100%" height="100%">
  <!-- Dark Contrast Card for OTT Light Brandmark -->
  <rect width="340" height="130" rx="14" fill="#080E1E" stroke="#1E293B" stroke-width="2"/>
  <g transform="translate(18, 15)">
    <!-- OTT Circular Green Emblem -->
    <g transform="translate(4, 2)">
      <!-- Outer Green Ring -->
      <circle cx="48" cy="48" r="42" fill="none" stroke="#35D458" stroke-width="9"/>
      <!-- Stylized Monogram Marks inside circle -->
      <path d="M 22 34 L 74 34" stroke="#35D458" stroke-width="8" stroke-linecap="round"/>
      <path d="M 44 38 L 36 68 L 32 78" stroke="#35D458" stroke-width="9" stroke-linecap="round"/>
      <path d="M 62 38 L 52 78" stroke="#35D458" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- OTT Wordmark -->
    <text x="114" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">
      OTT
    </text>
    <!-- VOUCHER Subtitle -->
    <text x="115" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="3.5">
      VOUCHER
    </text>
  </g>
</svg>
