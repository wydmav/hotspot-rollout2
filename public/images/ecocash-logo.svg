  <g transform="translate(16, 12)">
    <!-- EcoCash Main Text -->
    <text x="8" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="66" letter-spacing="-1.5">
