    <script>
      // Gracefully ignore WebSocket transport errors in cloud dev sandbox
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? String(event.message) : '';
        var file = event && event.filename ? String(event.filename) : '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason ? String(event.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.preventDefault) event.preventDefault();
        }
      }, true);
    </script>
