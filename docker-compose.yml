services:
  # ----------------------------------------------------------------------------
  # T-Connect Cloud Controller (Express API + Vite React Frontend)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tconnect-controller
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN:-app.tconnect.co.ls}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - RADIUS_SECRET=${RADIUS_SECRET:-radsec_tconnect_lesotho_99120}
      - ROUTER_API_PASSWORD=${ROUTER_API_PASSWORD:-tc_pass_crypto_random_32char}
      - OTTVOUCHER_MERCHANT_ID=${OTTVOUCHER_MERCHANT_ID:-TCONNECTLES1}
      - OTTVOUCHER_API_KEY=${OTTVOUCHER_API_KEY:-}
      - OTTVOUCHER_API_PASSWORD=${OTTVOUCHER_API_PASSWORD:-}
      - OTTVOUCHER_VENDOR_ID=${OTTVOUCHER_VENDOR_ID:-1, 11}
      - OTTVOUCHER_ENDPOINT_URL=${OTTVOUCHER_ENDPOINT_URL:-https://api.ottlesotho.com}
      - PAYLESOTHO_MERCHANT_ID=${PAYLESOTHO_MERCHANT_ID:-PL_MERCHANT_TCONNECT}
      - PAYLESOTHO_API_KEY=${PAYLESOTHO_API_KEY:-}
      - PAYLESOTHO_ENDPOINT_URL=${PAYLESOTHO_ENDPOINT_URL:-https://gateway.paylesotho.co.ls/api/v1}
    volumes:
      - ./data:/app/data
      - ./public/images:/app/public/images
      - ./public/videos:/app/public/videos
      - ./public/assets:/app/public/assets
    networks:
      - tconnect-net

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy with Automatic HTTPS
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: tconnect-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-app.tconnect.co.ls}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - tconnect-net

networks:
  tconnect-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
