services:
  # ----------------------------------------------------------------------------
  # T-Connect Cloud Controller (Express API + Vite React Frontend)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tconnect-controller
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN:-app.tconnect.co.ls}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - RADIUS_SECRET=${RADIUS_SECRET:-radsec_tconnect_lesotho_99120}
      - ROUTER_API_PASSWORD=${ROUTER_API_PASSWORD:-tc_pass_crypto_random_32char}
    networks:
      - tconnect-net

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy with Automatic HTTPS
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: tconnect-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-app.tconnect.co.ls}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - tconnect-net

networks:
  tconnect-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
